# Controller configuration consumed by the gz_ros2_control model plugin.
# Position interfaces deliberately start with a conservative 100 Hz update rate.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    panda_hand_physical_controller:
      type: joint_trajectory_controller/JointTrajectoryController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_physical_controller:
  ros__parameters:
    # Preserve q2's hardware-initialized 0.02 m command when this controller
    # activates.  Reading the already-settled state instead would silently
    # redefine the no-command GATE2 reference below the configured open pose.
    set_last_command_interface_value_as_state_on_activation: true
    joints:
      - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
