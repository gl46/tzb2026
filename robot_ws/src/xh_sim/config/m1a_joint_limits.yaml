# Velocity limits are copied from the sole controlled URDF and may not be
# overridden. Arm units are rad/rad/s/rad/s^2; finger units are m/m/s/m/s^2.
# Acceleration limits are the conservative values shipped by the Jazzy
# moveit_resources_panda_moveit_config package; the controlled URDF has no
# acceleration fields, and MoveIt's time parameterizer requires them.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2
joint_limits:
  panda_joint1: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 3.75}
  panda_joint2: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 1.875}
  panda_joint3: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 2.5}
  panda_joint4: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 3.125}
  panda_joint5: {has_velocity_limits: true, max_velocity: 2.8710, has_acceleration_limits: true, max_acceleration: 3.75}
  panda_joint6: {has_velocity_limits: true, max_velocity: 2.8710, has_acceleration_limits: true, max_acceleration: 5.0}
  panda_joint7: {has_velocity_limits: true, max_velocity: 2.8973, has_acceleration_limits: true, max_acceleration: 5.0}
  panda_finger_joint1: {has_velocity_limits: true, max_velocity: 0.2, has_acceleration_limits: true, max_acceleration: 1.0}
  panda_finger_joint2: {has_velocity_limits: true, max_velocity: 0.2, has_acceleration_limits: true, max_acceleration: 1.0}
