[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xh-202607-world-agent"
version = "0.1.0"
description = "P0-first world-model robot agent contracts and simulation baseline"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "jsonschema>=4.0,<5", "numpy>=1.26,<3", "eval-type-backport>=0.2; python_version < '3.10'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
